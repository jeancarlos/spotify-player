name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile --ignore-scripts
      - run: yarn lint
      - run: yarn test
      - run: yarn build

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit production dependencies
        # yarn v1 exit code is a bitmask: 8 = high, 16 = critical
        run: |
          yarn audit --groups dependencies || rc=$?
          [ $(( ${rc:-0} & 24 )) -eq 0 ]

      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  # Git flow: develop is the only branch humans push to; once CI is green the
  # same commit is fast-forwarded onto main, so main's required checks are
  # already satisfied by develop's runs.
  promote:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: [quality, audit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    steps:
      - name: Fast-forward main to the verified commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PATCH "repos/${{ github.repository }}/git/refs/heads/main" \
            -f sha="${{ github.sha }}" -F force=false

      # Pushes made with GITHUB_TOKEN do not trigger other workflows.
      - name: Trigger deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --repo "${{ github.repository }}" --ref main
